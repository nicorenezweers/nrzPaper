name: Release

# Runs when a GitHub release is published (or by hand for an existing tag):
# - pushes the multi-arch image ghcr.io/<owner>/nrz-paper:<version> (+ :latest)
# - attaches the program with its OCR package for linux amd64 and arm64 to the release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version and image name
        id: v
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nrz-paper" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Program and OCR package
        uses: docker/build-push-action@v6
        with:
          context: .
          target: umbrel
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.v.outputs.version }}
          for arch in amd64 arm64; do
            name="nrzpaper-$v-linux-$arch"
            mkdir -p "pkg/$name"
            cp -r dist/linux_$arch/. "pkg/$name/"
            cp README.md LICENSE "pkg/$name/"
            tar -C pkg -czf "$name.tar.gz" "$name"
            cp "dist/linux_$arch/nrzpaper" "nrzpaper-$v-linux-$arch"
          done
          sha256sum nrzpaper-$v-linux-* > SHA256SUMS
          gh release upload "$TAG" nrzpaper-$v-linux-* SHA256SUMS --clobber

      - name: Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=nrzPaper
            org.opencontainers.image.description=Self-hosted document management written in Rust
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
