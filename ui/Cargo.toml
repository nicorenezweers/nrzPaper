[package]
name = "nrzpaper-ui"
version = "1.3.0"
edition = "2024"
description = "Oberfläche von nrzPaper – Dioxus 0.7 (WebAssembly) mit Komponenten von rust-ui"
license = "MIT"
publish = false

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["web", "router", "macro", "html", "signals", "hooks", "launch", "logger"] }
icons = { version = "0.19", features = ["dioxus"] }
tw_merge = "0.1"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob", "DataTransfer", "DragEvent", "DomRect", "Element", "Event", "File", "FileList", "FormData", "HtmlElement",
  "HtmlInputElement", "Location", "Storage", "Url", "Window", "Document", "KeyboardEvent", "MouseEvent",
  "Navigator", "Clipboard", "XmlHttpRequest", "XmlHttpRequestUpload", "ProgressEvent", "UrlSearchParams",
] }
time = { version = "0.3", features = ["wasm-bindgen", "formatting", "macros"] }
urlencoding = "2"
futures-channel = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
